<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vegetables</title>
    <!-- Import Noto Sans Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Import External CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="top-bar">
                <h1 class="logo"><a href="index.html">Vegetables</a></h1>
                <div class="top-actions">
                    <img src="images/btn_facebook.png" alt="Facebook" class="social-img">
                    <img src="images/btn_instagram.png" alt="Instagram" class="social-img">
                    <a href="login.html"><button class="btn">LOGIN</button></a>
                    <a href="join.html"><button class="btn">JOIN</button></a>
                </div>
            </div>
            <nav class="nav-bar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="index.html#vegetables">Vegetables</a></li>
                    <li><a href="online.html">Online</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
            </nav>
        </header>

        <!-- Main Banner -->
        <div class="main-banner">
            <img src="images/img_main_pumpkin.png" alt="Vegetables Main Banner">
        </div>

        <!-- Main Content Area -->
        <main class="content-wrapper">
            <section class="card left-card">
                <h2 class="section-title">Member Login</h2>
                <div class="card-content">
                    <form class="custom-form">
                        <div class="form-field">
                            <label>Email Address</label>
                            <input type="email" placeholder="Enter your email" required>
                        </div>
                        <div class="form-field">
                            <label>Password</label>
                            <input type="password" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="custom-submit-btn">LOGIN</button>
                    </form>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            Copyrights 2017 Vegetables | Design by Vegetables
        </footer>
    </div>

</body>
</html>
